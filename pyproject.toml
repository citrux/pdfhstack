[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfhstack"
version = "0.1.0"
description = "Merge pages of pdf documents horizontally"
authors = [{name = "Vladimir Abdrakhmanov", email = "vlabdrake@protonmail.com"}]
readme = "readme.md"
requires-python = ">=3.10"
dependencies = ["pypdf"]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
pdfhstack = "pdfhstack:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "PL"]
